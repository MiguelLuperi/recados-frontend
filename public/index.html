<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Recados - CI/CD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .version {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
      display: grid;
      gap: 10px;
    }

    label {
      font-weight: 600;
      color: #333;
    }

    input, textarea {
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4facfe;
      box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
    }

    .btn-carregar {
      width: 100%;
      margin-bottom: 30px;
    }

    .recados-container {
      display: grid;
      gap: 15px;
    }

    .recado {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #4facfe;
    }

    .recado h3 {
      color: #333;
      margin-bottom: 10px;
    }

    .recado p {
      color: #666;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .recado-meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
    }

    .autor {
      display: inline-block;
      background: #4facfe;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .btn-excluir {
      background: #ff4d4d;
      width: 100%;
    }

    .loading {
      text-align: center;
      color: #4facfe;
      padding: 20px;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #c33;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #3c3;
    }

    .api-v1 {
      margin-bottom: 20px;
      padding: 15px;
      background: #f0fff0;
      border-radius: 8px;
      border-left: 4px solid #3c3;
    }

    .api-v1 h3 {
      margin-bottom: 10px;
      color: #333;
    }

    .api-v1 button {
      margin-bottom: 10px;
    }

    .api-v1 p {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>💬 Sistema de Recados</h1>

    <p class="version">
      v1.0.0 - CI/CD com Vercel + Render
    </p>

    <div class="api-v1">
      <h3>🔗 Status da API v1</h3>
      <button onclick="chamarAPI()">Testar /v1</button>
      <p id="resposta-v1">Clique no botão para testar.</p>
    </div>

    <div id="mensagem"></div>

    <div class="form-group">
      <button class="btn-carregar" onclick="carregarRecados()">
        🔄 Carregar Recados
      </button>
    </div>

    <div style="margin-bottom: 40px; padding: 20px; background: #eef8ff; border-radius: 8px; border-left: 4px solid #4facfe;">

      <h3 style="margin-bottom: 15px;">
        ➕ Adicionar Novo Recado
      </h3>

      <div class="form-group">
        <label>Autor</label>
        <input type="text" id="autor" placeholder="Digite seu nome" />
      </div>

      <div class="form-group">
        <label>Mensagem</label>
        <textarea id="mensagemRecado" placeholder="Digite seu recado"></textarea>
      </div>

      <button onclick="criarRecado()" style="width: 100%;">
        Enviar Recado
      </button>

    </div>

    <h2 style="margin-bottom: 20px; color: #333;">
      Recados do Sistema:
    </h2>

    <p id="contador" style="margin-bottom:20px; color:#666;">
      Total de recados: 0
    </p>

    <div id="recados" class="recados-container"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
